[package]
name = "uniprot-etl-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for UniProt ETL pipeline"

[lib]
name = "uniprot_etl_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# UniProt ETL library
uniprot_etl = { path = "../.." }
