[workspace]
members = [".", "gui/src-tauri"]
resolver = "2"

[package]
name = "uniprot_etl"
version = "0.1.0"
edition = "2021"
description = "High-throughput, zero-copy, streaming ETL engine for UniProtKB/Swiss-Prot XML to Apache Parquet"
license = "MIT"

[dependencies]
indicatif = "0.17"
# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# XML parsing (event-based, no DOM)
quick-xml = "0.37"

# Arrow + Parquet (nested columnar)
arrow = { version = "53", default-features = false, features = ["ffi"] }
parquet = { version = "53", features = ["zstd"] }

# Streaming gzip decompression
flate2 = "1"

# Bounded producer-consumer channel
crossbeam-channel = "0.5"

# Parallel iteration (swarm mode)
rayon = "1.10"

# File pattern matching (swarm mode)
glob = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Execution ledger & diagnostics
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }

# Prometheus metrics HTTP server
axum = "0.7"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tikv-jemallocator = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
flamegraph = "0.6"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "flamegraph_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true

# CRITICAL: Build CPU-intensive crates with optimizations even in dev mode
# This prevents 10-50x slowdowns when running `cargo tauri dev` or `cargo run`
[profile.dev.package.uniprot_etl]
opt-level = 3

[profile.dev.package.quick-xml]
opt-level = 3

[profile.dev.package.arrow]
opt-level = 3

[profile.dev.package.parquet]
opt-level = 3

[profile.dev.package.zstd]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3
